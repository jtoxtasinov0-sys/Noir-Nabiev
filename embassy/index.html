<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Across America</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
  :root {
    --ink: #131B35; --muted: #5E6378; --soft: #8A8E9E;
    --line: #E3DCCB; --line2: #D3CAB4;
    --cream: #F7F2E5; --cream2: #EFE7D3;
    --accent: #C8432C; --accent-soft: #EE8A68; --sky: #2198C5; --navy: #0E1630;
    --yt: #E62117; --ig: #C13584;
    --f-display: "Playfair Display", Georgia, serif;
    --f-sans: "Manrope", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--f-sans); color: var(--ink); font-size: 9pt; line-height: 1.45; -webkit-print-color-adjust: exact; print-color-adjust: exact; font-variant-numeric: lining-nums; }
  .page > * { flex-shrink: 0; }
  @media screen { body { background: #9A9AA2; padding: 8mm 0; } .page { margin: 0 auto 8mm; box-shadow: 0 2mm 8mm rgba(0,0,0,.25); } }
  img { display: block; max-width: 100%; }
  .i { width: 1em; height: 1em; fill: currentColor; flex: none; }
  .mono { font-family: var(--f-mono); }
  em { font-style: italic; }

  .page { width: 210mm; height: 297mm; padding: 11mm 14mm 9mm; position: relative; overflow: hidden; background: #fff; display: flex; flex-direction: column; break-after: page; page-break-after: always; }
  .page:last-child { break-after: auto; page-break-after: auto; }

  /* header / footer */
  .ph { display: flex; justify-content: space-between; align-items: center; font: 500 6.6pt/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 2.6mm; border-bottom: .25mm solid var(--line2); margin-bottom: 5mm; }
  .ph__l { display: flex; align-items: center; gap: 2.2mm; }
  .ph__r b { color: var(--ink); font-weight: 500; }
  .flag { display: inline-block; width: 5.6mm; height: 3.4mm; border-radius: .5mm; background: url(../assets/img/us-flag.svg) center/100% 100% no-repeat; box-shadow: 0 0 0 .2mm rgba(19,27,53,.18); flex: none; }
  .pf { margin-top: auto; display: flex; justify-content: space-between; gap: 6mm; padding-top: 2.6mm; border-top: .25mm solid var(--line); font: 400 6.4pt/1.3 var(--f-mono); letter-spacing: .04em; color: var(--soft); }

  /* type */
  .eyebrow { margin: 0 0 1.6mm; font: 500 6.8pt/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 2mm; }
  h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 800; letter-spacing: -.01em; }
  h1 { font-size: 42pt; line-height: .95; }
  h1 em, h2 em { color: var(--accent); font-weight: 700; }
  h2 { font-size: 19pt; line-height: 1.08; }
  .lead { margin: 2.6mm 0 0; font-size: 10pt; line-height: 1.5; color: #2F3650; }
  .sec { margin-top: 5.5mm; }
  .page--tight .sec { margin-top: 4.5mm; }
  .sec__head { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; align-items: end; margin-bottom: 4mm; }
  .sec__head .lead { margin: 0; font-size: 9pt; color: var(--muted); }

  /* ===== page 1 ===== */
  .hero { display: grid; grid-template-columns: 1fr 66mm; gap: 7mm; align-items: end; }
  .hero h1 { margin-top: 1mm; }
  .hero .lead { margin-top: 0; font-size: 9.6pt; }
  .facts { margin-top: 6mm; display: grid; grid-template-columns: repeat(4, 1fr); border-top: .3mm solid var(--ink); border-bottom: .25mm solid var(--line2); }
  .fact { padding: 3mm 3mm 3mm 0; display: flex; flex-direction: column; gap: .6mm; }
  .fact + .fact { padding-left: 4mm; border-left: .25mm solid var(--line); }
  .fact b { font: 800 19pt/1 var(--f-display); }
  .fact small { font-size: 7.6pt; color: var(--muted); }

  .route { display: grid; grid-template-columns: 1fr 58mm; gap: 6mm; align-items: center; }
  .map { width: 100%; height: auto; display: block; }
  .map .st { fill: #ECE5D3; stroke: #fff; stroke-width: 1; }
  .map .leg { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 7 6; stroke-linecap: round; }
  .map .dot { fill: var(--accent); stroke: #fff; stroke-width: 3; }
  .map .num { font: 700 15px/1 var(--f-sans); fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .map .lbl { font: 700 17px/1 var(--f-sans); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
  .map .inset { fill: none; stroke: var(--line2); stroke-width: 1.2; stroke-dasharray: 3 4; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: grid; grid-template-columns: 7mm 1fr; gap: 2.4mm; align-items: center; padding: 2.1mm 0; border-bottom: .25mm solid var(--line); }
  .steps li:first-child { border-top: .25mm solid var(--line); }
  .steps .n { width: 6.4mm; height: 6.4mm; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 7.6pt/1 var(--f-sans); }
  .steps b { display: block; font-size: 10pt; line-height: 1.15; }
  .steps small { display: block; font: 400 6.6pt/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .cities { margin-top: 5mm; display: grid; grid-template-columns: repeat(5, 1fr); gap: 3mm; }
  .city__img { position: relative; aspect-ratio: 3 / 4; border-radius: 2mm; overflow: hidden; background: var(--cream2); }
  .city__img img { width: 100%; height: 100%; object-fit: cover; }
  .city__img .n { position: absolute; left: 2mm; top: 2mm; width: 6mm; height: 6mm; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; font: 800 7.4pt/1 var(--f-sans); }
  .city__st { margin: 2mm 0 .6mm; font: 500 6.2pt/1.2 var(--f-mono); letter-spacing: .1em; color: var(--accent); }
  .city__t { margin: 0; font-size: 7.6pt; line-height: 1.38; color: #2F3650; }

  .watch { margin-top: 5mm; display: grid; grid-template-columns: auto 1fr auto; gap: 4mm; align-items: center; padding: 3.6mm 4.5mm; border-radius: 2.4mm; background: var(--cream); }
  .watch .yt { width: 9mm; height: 9mm; color: var(--yt); }
  .watch p { margin: 0; font-size: 8.4pt; line-height: 1.45; color: #2F3650; }
  .watch .url { font: 500 7.4pt/1 var(--f-mono); color: var(--ink); white-space: nowrap; }

  /* ===== page 2 ===== */
  .hosts { margin-top: 3.5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 5mm; }
  .host { border: .25mm solid var(--line2); border-radius: 3mm; padding: 4mm; display: flex; flex-direction: column; gap: 3.2mm; }
  .host__top { display: grid; grid-template-columns: 28mm 1fr; gap: 3.6mm; }
  .host__photo { align-self: start; aspect-ratio: 1; border-radius: 50%; padding: .55mm; background: linear-gradient(45deg, #F9CE34, #EE2A7B 55%, #6228D7); }
  .host__photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: .7mm solid #fff; }
  .host__name { font: 800 13pt/1.05 var(--f-display); }
  .host__handle { margin-top: 1.2mm; display: flex; align-items: center; gap: 1mm; font: 500 7pt/1 var(--f-mono); color: var(--muted); }
  .host__handle .i { width: 3.2mm; height: 3.2mm; color: #3897F0; }
  .host__role { margin-top: 1.4mm; font-size: 7.8pt; font-weight: 600; color: var(--accent); }
  .host__stats { margin-top: 2.6mm; display: grid; grid-template-columns: 1fr 1fr; gap: 2mm; }
  .hstat { display: flex; flex-direction: column; gap: .5mm; padding: 2mm 2.4mm; border-radius: 1.6mm; background: var(--cream); }
  .hstat b { display: flex; align-items: center; gap: 1.2mm; white-space: nowrap; font: 800 10.4pt/1 var(--f-sans); letter-spacing: -.01em; }
  .hstat b .i { width: 3.4mm; height: 3.4mm; }
  .hstat .ig { color: var(--ig); } .hstat .ytc { color: var(--yt); } .hstat .mu { color: var(--muted); }
  .hstat small { font-size: 6.6pt; color: var(--muted); }
  .host__hook { margin: 0; font-size: 7.9pt; line-height: 1.45; color: #2F3650; }
  .host__thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6mm; }
  .host__thumbs img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 22%; border-radius: 1.4mm; background: var(--cream2); }

  .kband { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.6mm; }
  .ktile { padding: 3mm 3.2mm; border-radius: 2mm; background: var(--cream); display: flex; flex-direction: column; gap: .8mm; }
  .ktile b { font: 800 15pt/1 var(--f-display); }
  .ktile small { font-size: 6.9pt; line-height: 1.3; color: var(--muted); }
  .ktile--total { background: var(--navy); color: #fff; }
  .ktile--total small { color: rgba(255,255,255,.72); }
  .ktile--total b { color: #fff; }
  .ktile .ava { display: flex; margin-bottom: .6mm; }
  .ktile .ava img { width: 6mm; height: 6mm; border-radius: 50%; object-fit: cover; border: .4mm solid var(--navy); }
  .ktile .ava img + img { margin-left: -1.6mm; }

  .panels { margin-top: 3mm; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2.6mm; }
  .panel { border: .25mm solid var(--line2); border-radius: 2mm; padding: 3mm 3.2mm; display: flex; flex-direction: column; gap: 2.2mm; }
  .panel__h { display: flex; align-items: center; gap: 1.6mm; font: 700 8pt/1 var(--f-sans); }
  .panel__h img { width: 5.4mm; height: 5.4mm; border-radius: 50%; object-fit: cover; }
  .panel__h .i { width: 3.6mm; height: 3.6mm; margin-left: auto; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: .8mm 2mm; margin: 0; font-size: 7.3pt; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; text-align: right; }
  .sub { font: 500 6pt/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin-bottom: 1.2mm; }
  .ages { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1mm; align-items: end; height: 10mm; }
  .ages i { display: block; background: #D9CFB8; border-radius: .6mm .6mm 0 0; }
  .ages i.hi { background: var(--accent); }
  .ages__l { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1mm; margin-top: .8mm; font: 400 4.9pt/1 var(--f-mono); color: var(--soft); text-align: center; letter-spacing: -.02em; }
  .split { display: flex; height: 2.2mm; border-radius: 1.1mm; overflow: hidden; }
  .split i:first-child { background: var(--navy); } .split i:last-child { background: var(--accent-soft); }
  .split__l { display: flex; justify-content: space-between; margin-top: .9mm; font-size: 6.6pt; color: var(--muted); }
  .split__l b { color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 1.2mm; }
  .chips span { padding: 1mm 2mm; border-radius: 3mm; background: var(--cream); font-size: 6.8pt; font-weight: 600; }
  .big { font: 800 22pt/1 var(--f-display); }
  .big small { display: block; margin-top: 1mm; font: 400 7pt/1.3 var(--f-sans); color: var(--muted); }
  .verified { display: inline-flex; align-items: center; gap: 1mm; font-size: 7pt; font-weight: 700; color: #2B7BD6; }
  .verified .i { width: 3.4mm; height: 3.4mm; }

  .vids { margin-top: 3mm; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.6mm; }
  .vid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 1.4mm; }
  .vid b { display: block; margin-top: 1.2mm; font-size: 7pt; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vid small { font: 500 6.4pt/1 var(--f-mono); color: var(--accent); }
  .vids__h { margin-top: 3mm; }

  /* ===== page 3 ===== */
  .roles { margin-top: 4.5mm; display: grid; grid-template-columns: 1fr 9mm 1fr; align-items: stretch; }
  .role { border: .25mm solid var(--line2); border-radius: 3mm; padding: 4.5mm; display: grid; grid-template-columns: 41mm 1fr; gap: 4mm; align-items: center; }
  .role h3 { display: flex; align-items: center; gap: 1.8mm; font-size: 11.5pt; line-height: 1.1; }
  .role p { margin: 1.6mm 0 0; font-size: 7.9pt; line-height: 1.45; color: #2F3650; }
  .tag { width: 5mm; height: 5mm; border-radius: 1.2mm; display: grid; place-items: center; font: 800 7pt/1 var(--f-sans); color: #fff; flex: none; }
  .tag--a { background: var(--navy); } .tag--b { background: var(--accent); }
  .duel { align-self: center; justify-self: center; font: italic 800 12pt/1 var(--f-display); color: var(--accent); }

  .card { position: relative; aspect-ratio: 1.586; border-radius: 2.4mm; padding: 2.6mm 3mm; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; font-size: 6.2pt; }
  .card--a { background: linear-gradient(135deg, #22305A 0%, #0E1630 70%); color: #fff; }
  .card--b { background: var(--cream); border: .3mm solid var(--line2); color: var(--ink); }
  .card__top, .card__bot { display: flex; justify-content: space-between; align-items: center; }
  .card__brand { font: italic 800 7pt/1 var(--f-display); display: flex; align-items: center; gap: 1mm; }
  .card__brand .flag { width: 4mm; height: 2.4mm; }
  .card__tier { font: 500 4.8pt/1 var(--f-mono); letter-spacing: .14em; opacity: .75; }
  .card__chip { width: 6.4mm; height: 4.6mm; border-radius: .9mm; background: linear-gradient(135deg, #E9CF8B, #B48A3E 60%, #E5C77F); }
  .card__num { font: 500 5pt/1 var(--f-mono); letter-spacing: .12em; opacity: .75; }
  .card__big { position: absolute; right: 3mm; top: 50%; transform: translateY(-55%); font: 800 21pt/1 var(--f-display); }
  .card--a .card__big { color: var(--accent-soft); font-size: 26pt; }
  .card--b .card__big { color: var(--accent); }

  .rules { list-style: none; margin: 4mm 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); border-top: .25mm solid var(--line2); border-bottom: .25mm solid var(--line2); }
  .rules li { display: flex; align-items: center; gap: 2.2mm; padding: 3mm 2.5mm 3mm 0; font-size: 7.8pt; font-weight: 600; line-height: 1.3; }
  .rules li + li { padding-left: 3mm; border-left: .25mm solid var(--line); }
  .rules .i { width: 5mm; height: 5mm; color: var(--accent); }

  .students__txt { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; align-items: end; }
  .students__txt > p { margin: 0; font-size: 8.8pt; line-height: 1.5; color: #2F3650; }
  .shots { margin-top: 4mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; }
  .shot__img { position: relative; height: 92mm; border-radius: 2mm; overflow: hidden; background: var(--cream2); }
  .shot__img img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
  .shot__img .ph-empty { position: absolute; inset: 0; display: grid; place-items: center; font: 500 7pt/1.3 var(--f-mono); color: var(--soft); text-align: center; padding: 4mm; }
  .shot__tag { position: absolute; z-index: 2; left: 2mm; bottom: 2mm; padding: .9mm 1.8mm; border-radius: 1mm; background: rgba(255,255,255,.88); font: 500 5.4pt/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .shot figcaption { margin-top: 1.6mm; font-size: 7.4pt; font-weight: 600; }
  .shot figcaption span { display: block; font: 500 6pt/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .shot { margin: 0; }

  .season { margin-top: 6mm; display: grid; grid-template-columns: 38mm repeat(4, 1fr); border-radius: 2.4mm; background: var(--navy); color: #fff; overflow: hidden; }
  .season__h { padding: 4mm; display: flex; flex-direction: column; justify-content: center; gap: 1.2mm; background: var(--accent); }
  .season__h b { font: 800 14pt/1 var(--f-display); }
  .season__h small { font: 500 6.2pt/1.35 var(--f-mono); letter-spacing: .06em; opacity: .9; }
  .season__i { padding: 4mm 3.4mm; display: flex; flex-direction: column; gap: 1mm; border-left: .25mm solid rgba(255,255,255,.12); }
  .season__i b { font: 800 16pt/1 var(--f-display); }
  .season__i small { font-size: 7pt; line-height: 1.3; color: rgba(255,255,255,.74); }
</style>
</head>
